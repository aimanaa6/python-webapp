<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Funniest Form Ever</title>
    <style>
        body {
            background: radial-gradient(circle at top left, #ff00ff, #00ffff);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            color: #000;
            text-align: center;
            padding-top: 100px;
            animation: backgroundSpin 10s linear infinite;
        }

        @keyframes backgroundSpin {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        form {
            display: inline-block;
            padding: 30px;
            border: 10px dashed hotpink;
            background-color: rgba(255, 255, 255, 0.8);
            transform: rotate(-1deg);
            box-shadow: 0 0 20px 5px #ff00ff;
        }

        label {
            display: block;
            font-size: 24px;
            margin: 20px 0 5px;
            color: #ff0000;
            transform: skewX(-10deg);
        }

        input[type="text"] {
            font-size: 30px;
            padding: 10px;
            border: 5px dotted limegreen;
            width: 300px;
            background-color: #ffffe0;
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        button {
            font-size: 24px;
            padding: 20px;
            margin-top: 30px;
            background: linear-gradient(45deg, red, yellow, lime, cyan, blue, magenta, red);
            color: black;
            border: 5px solid black;
            cursor: grab;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.5) rotate(10deg);
        }
    </style>
</head>
<body>
    <form method="POST" action="/register">
        <label for="username">🧙uSERNMAmE?</label>
        <input type="text" id="username" name="username" required>

        <label for="password">🔐 pASSWORD</label>
        <input type="text" id="password" name="password" required>

        <button type="submit">✨rEgister✨</button>
    </form>
</body>
</html>
